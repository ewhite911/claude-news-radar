name: radar

# 15분마다 클로드 공식 소스를 확인하고, 새 소식이 있으면 ntfy 로 푸시한다
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # 정각(:00)은 GitHub 예약이 몰려 자주 빠져서 7분 어긋나게
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 새 소식 확인
        run: node radar.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 본 소식 목록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "본 소식 갱신" && git push)
